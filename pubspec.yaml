name: flutter_apns_x
description: Demonstrates how to use the flutter_apnsX plugin.
version: 0.0.1
homepage: https://github.com/Money1998/custom_apnsX.git

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  path_provider: ^2.0.12
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  plugin:
    platforms:
      ios:
        pluginClass: FlutterApnsPlugin

dependency_overrides:
